# Builds the Android APK. Every run keeps it as a downloadable artifact; a tag like v1.0.0 also publishes a Release
# with the APK and the single-file HTML attached (the link to share with friends).
name: Android APK
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build web
        run: node build.mjs && node scripts/standalone.mjs
      - name: Create Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          rm -rf www && cp -r ../dist www && rm -f www/wathiq-standalone.html
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#ff8a1f' --iconBackgroundColorDark '#121b2e' --splashBackgroundColor '#fff6e8' --splashBackgroundColorDark '#121b2e'
          # Android 10 and older need storage permission to save into Documents/Wathiq
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />#' android/app/src/main/AndroidManifest.xml
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION="1.0.${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk wathiq-pdf.apk
      - uses: actions/upload-artifact@v4
        with: { name: wathiq-pdf-apk, path: wathiq-pdf.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: وثيق PDF ${{ github.ref_name }}
          body: |
            - **wathiq-pdf.apk**: Android app. On the phone allow "Install unknown apps" for your browser, then open the file.
            - **wathiq-standalone.html**: the whole app in one file. Open it in Chrome, Edge or Safari (internet needed for the PDF libraries).
            - Web version: GitHub Pages link in the repository's About box.
            - Server/container: `docker run -p 8080:8080 ghcr.io/${{ github.repository }}:latest`
          files: |
            wathiq-pdf.apk
            dist/wathiq-standalone.html
